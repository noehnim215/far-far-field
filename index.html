<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e1e1e1">
  <title>FAR FAR FIELD — 2028</title>
  <script>
  (function(d) {
    var config = { kitId: 'wno3het', scriptTimeout: 3000, async: true };
    var h = d.documentElement, t = setTimeout(function() {
      h.className = h.className.replace(/\bwf-loading\b/g, "") + " wf-inactive";
    }, config.scriptTimeout);
    var tk = d.createElement("script"), f = false, s = d.getElementsByTagName("script")[0], a;
    h.className += " wf-loading";
    tk.src = "https://use.typekit.net/" + config.kitId + ".js";
    tk.async = true;
    tk.onload = tk.onreadystatechange = function() {
      a = this.readyState;
      if (f || a && a !== "complete" && a !== "loaded") return;
      f = true; clearTimeout(t);
      try { Typekit.load(config); } catch (e) {}
    };
    s.parentNode.insertBefore(tk, s);
  })(document);
  </script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="composition" aria-label="FAR FAR FIELD layered artwork">
    <div class="artwork" id="artwork">
      <img id="blackHole" class="art-layer black-hole-layer" src="./black-hole.png" alt="Black hole oval">
      <img id="fieldImage" class="art-layer field-layer" src="./field.png" alt="Blue green field oval">
    </div>
  </main>
  <button class="editor-toggle" id="editorToggle" type="button" aria-controls="editor" aria-expanded="true">HIDE CONTROLS</button>
  <aside class="editor" id="editor" aria-label="Image layout controls">
    <div class="editor-heading">IMAGE CONTROLS</div>
    <label for="target">SELECT IMAGE</label>
    <select id="target">
      <option value="blackHole">BLACK HOLE (BOTTOM)</option>
      <option value="fieldImage">FIELD (TOP)</option>
    </select>
    <label for="scale">SIZE <output id="scaleValue">100%</output></label>
    <input id="scale" type="range" min="10" max="200" step="1">
    <label for="x">HORIZONTAL <output id="xValue">0%</output></label>
    <input id="x" type="range" min="-100" max="100" step="1">
    <label for="y">VERTICAL <output id="yValue">0%</output></label>
    <input id="y" type="range" min="-100" max="100" step="1">
    <div class="editor-actions"><button id="save" type="button">SAVE</button><button id="reset" type="button">RESET</button></div>
    <button id="copyLayout" type="button" class="copy-layout">COPY LAYOUT CODE</button>
    <p id="editorStatus" role="status">Drag either image or use the sliders. SAVE stores this layout in your browser.</p>
  </aside>
  <script src="./editor.js" defer></script>
</body>
</html>
